# Supabase configuration (used by `supabase start` locally and `supabase link`).
# See https://supabase.com/docs/guides/cli/config

project_id = "pilates-studio-app"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[auth]
enabled = true
site_url = "https://pilateswithneelam.in"
additional_redirect_urls = ["http://localhost:3000", "http://localhost:5500", "http://localhost:8000", "https://pilateswithneelam.in"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = true

[storage]
enabled = false

[functions]
enabled = true
verify_jwt = true

[functions.ai-proxy]
verify_jwt = true

[realtime]
enabled = true
